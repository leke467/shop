<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block title %}MultiShop{% endblock %}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style type="text/css">
    /* Reset */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; }

    /* Base Styles */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #F1F5F9;
      color: #1E293B;
      line-height: 1.6;
    }

    .email-wrapper {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      background-color: #FFFFFF;
    }

    /* Header */
    .email-header {
      background: linear-gradient(135deg, #022C22 0%, #064E3B 100%);
      padding: 32px 40px;
      text-align: center;
    }
    .email-header h1 {
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.5px;
    }
    .email-header .subtitle {
      color: #6EE7B7;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* Body */
    .email-body {
      padding: 40px;
    }

    /* Typography */
    h2 {
      color: #0F172A;
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 16px 0;
      line-height: 1.3;
    }
    p {
      color: #475569;
      font-size: 15px;
      margin: 0 0 16px 0;
      line-height: 1.7;
    }
    .text-muted {
      color: #94A3B8;
      font-size: 13px;
    }
    .text-accent {
      color: #059669;
      font-weight: 600;
    }

    /* Badge */
    .badge {
      display: inline-block;
      background-color: #F59E0B;
      color: #78350F;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .badge-success {
      background-color: #D1FAE5;
      color: #065F46;
    }
    .badge-info {
      background-color: #DBEAFE;
      color: #1E40AF;
    }
    .badge-warning {
      background-color: #FEF3C7;
      color: #92400E;
    }

    /* Button */
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: #FFFFFF !important;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 8px;
      text-align: center;
      letter-spacing: 0.3px;
      mso-padding-alt: 0;
    }
    .btn:hover {
      background: linear-gradient(135deg, #047857 0%, #065F46 100%);
    }

    /* Card / Info Box */
    .info-box {
      background-color: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 24px;
      margin: 24px 0;
    }
    .info-box-accent {
      background-color: #ECFDF5;
      border: 1px solid #A7F3D0;
      border-left: 4px solid #059669;
    }
    .info-box-warning {
      background-color: #FFFBEB;
      border: 1px solid #FDE68A;
      border-left: 4px solid #F59E0B;
    }

    /* Code Block (for delivery codes, reset tokens) */
    .code-block {
      background: linear-gradient(135deg, #022C22 0%, #064E3B 100%);
      color: #F59E0B;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 8px;
      text-align: center;
      padding: 20px;
      border-radius: 12px;
      font-family: 'Courier New', Courier, monospace;
      margin: 20px 0;
    }

    /* Table */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    .data-table th {
      background-color: #F1F5F9;
      color: #64748B;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 16px;
      text-align: left;
      border-bottom: 2px solid #E2E8F0;
    }
    .data-table td {
      padding: 12px 16px;
      font-size: 14px;
      color: #334155;
      border-bottom: 1px solid #F1F5F9;
    }
    .data-table .total-row td {
      font-weight: 700;
      font-size: 16px;
      color: #0F172A;
      border-top: 2px solid #E2E8F0;
      border-bottom: none;
    }

    /* Divider */
    .divider {
      border: none;
      border-top: 1px solid #E2E8F0;
      margin: 28px 0;
    }

    /* Footer */
    .email-footer {
      background-color: #F8FAFC;
      border-top: 1px solid #E2E8F0;
      padding: 28px 40px;
      text-align: center;
    }
    .email-footer p {
      color: #94A3B8;
      font-size: 12px;
      margin: 0 0 6px 0;
      line-height: 1.5;
    }
    .email-footer a {
      color: #059669;
      text-decoration: none;
      font-weight: 600;
    }

    /* Responsive */
    @media only screen and (max-width: 640px) {
      .email-wrapper { width: 100% !important; }
      .email-body { padding: 24px 20px !important; }
      .email-header { padding: 24px 20px !important; }
      .email-footer { padding: 20px !important; }
      .code-block { font-size: 24px !important; letter-spacing: 4px !important; }
    }
  </style>
</head>
<body>
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F1F5F9;">
    <tr>
      <td align="center" style="padding: 24px 16px;">

        <!-- Email Container -->
        <table role="presentation" class="email-wrapper" cellpadding="0" cellspacing="0" width="640" style="background-color: #FFFFFF; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.06);">
          <!-- Header -->
          <tr>
            <td class="email-header">
              <h1>MultiShop</h1>
              <div class="subtitle">Marketplace</div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td class="email-body">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="email-footer">
              <p>&copy; {% now "Y" %} MultiShop Marketplace. All rights reserved.</p>
              <p>Powered by <a href="https://apexlabs.it.com" target="_blank">ApexLabs</a></p>
              <p style="margin-top: 12px; font-size: 11px;">
                You're receiving this email because you have an account on MultiShop.<br>
                If you believe you received this in error, please ignore this email.
              </p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
